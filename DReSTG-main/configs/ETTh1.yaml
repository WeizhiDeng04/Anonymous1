# dataset
root_path: 'datasets/Ett_Series'
data_path: 'ETTh1.csv'
scale: True
traget: 'OT'

# model
model: 'DReSTG'
e_layers: 2
d_layers: 1
enc_in: 7
fine_patch_len: 12
fine_patch_stride: 6
coarse_patch_count: 7
gnn_r_degree: 1
mixhop_depth: 1
mixhop_alpha: 0.05
mixhop_support_preserving: False
affine: False

# train
itr: 1
batch_size: 128
patience: 5
train_epochs: 100
checkpoints: "checkpoints/Ett_series/ETTh1"
lradj: "type3"
pct_start: 0.3

# adjust
d_model: 32
n_heads: 8
d_ff: 128
learning_rate: 0.001
dropout: 0.5
head_dropout: 0.0
gnn_hidden_size: 32
graph_conv_hidden_size: 4
graph_conv_kernel_size: 3
subgraph_keep_rate: 0.7
softk_mass_ratio: 0.5
