root_path: 'datasets/Customs'
data_path: 'electricity.csv'
scale: True
traget: 'OT'

model: 'DReSTG'
e_layers: 3
d_layers: 1
enc_in: 321
fine_patch_len: 12
fine_patch_stride: 6
coarse_patch_count: 7
gnn_r_degree: 1
mixhop_depth: 1
mixhop_alpha: 0.05
mixhop_support_preserving: False
affine: False

itr: 1
batch_size: 16
patience: 5
train_epochs: 100
checkpoints: "checkpoints/Customs/electricity"

d_model: 64
n_heads: 16
d_ff: 256
learning_rate: 0.0005
dropout: 0.2
gnn_hidden_size: 32
graph_conv_hidden_size: 4
graph_conv_kernel_size: 5
subgraph_keep_rate: 0.01
softk_mass_ratio: 0.01
