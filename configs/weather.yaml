root_path: 'datasets/Customs'
data_path: 'weather.csv'
scale: True
traget: 'OT'

model: 'DReSTG'
e_layers: 2
d_layers: 1
enc_in: 21
fine_patch_len: 24
fine_patch_stride: 12
coarse_patch_count: 7
gnn_r_degree: 1
mixhop_depth: 1
mixhop_alpha: 0.05
mixhop_support_preserving: False
affine: False

itr: 1
batch_size: 128
patience: 5
train_epochs: 100
checkpoints: "checkpoints/Customs/weather"

d_model: 64
n_heads: 16
d_ff: 256
learning_rate: 0.001
dropout: 0.2
gnn_hidden_size: 64
graph_conv_hidden_size: 8
graph_conv_kernel_size: 3
subgraph_keep_rate: 0.3
softk_mass_ratio: 0.2
